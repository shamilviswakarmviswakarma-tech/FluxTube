name: NovaTube Clean App CI

on:
  push:
    branches: [main]
    paths:
      - "nova_app/**"
      - ".github/workflows/nova-app-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name novatube_app .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart formatting
        run: dart format lib test

      - name: Commit formatter changes
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style(novatube): apply canonical Dart formatting"
            git push
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTube-clean-debug-APK
          path: nova_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
